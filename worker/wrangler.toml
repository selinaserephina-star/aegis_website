name = "aegis-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# KV namespace for Ask ExoCortex sessions
# Setup before first deploy:
#   wrangler kv:namespace create ASK_SESSIONS
#   → copy the id output below
[[kv_namespaces]]
binding = "ASK_SESSIONS"
id = "REPLACE_WITH_NAMESPACE_ID"

# Secrets (set via wrangler secret put):
#   CLAUDE_API_KEY     — already set
#   RESEND_API_KEY     — already set
#   STRIPE_SECRET_KEY  — new: wrangler secret put STRIPE_SECRET_KEY

# After deploying, the worker URL will be:
# https://aegis-proxy.<your-subdomain>.workers.dev
#
# To use a custom domain instead (e.g. api.ægis.no):
# 1. Add ægis.no to Cloudflare (DNS must be on CF)
# 2. Uncomment and update the route below:
#
# routes = [
#   { pattern = "api.xn--gis-xla.no/*", zone_name = "xn--gis-xla.no" }
# ]
