name = "aegis-webhook"
main = "index.js"
compatibility_date = "2024-01-01"

# Secrets (never put values here — use: wrangler secret put <NAME>):
#   STRIPE_WEBHOOK_SECRET   — from Stripe dashboard → Webhooks → signing secret
#   RESEND_API_KEY          — from resend.com → API Keys

[[queues.producers]]
queue = "kcp-jobs"
binding = "KCP_JOBS"

# Route: map to a path on ægis.no
# Requires ægis.no DNS to be managed on Cloudflare.
# Uncomment and update after adding the domain to Cloudflare:
#
# routes = [
#   { pattern = "xn--gis-xla.no/api/stripe-webhook", zone_name = "xn--gis-xla.no" }
# ]

# Or use a workers.dev subdomain for initial testing:
# https://aegis-webhook.<your-subdomain>.workers.dev
